name: fox-dispatch

on:
  push:
    paths:
      - 'tasks/queue/**'
  workflow_dispatch:
  repository_dispatch:
    types: [fox-task]
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: fox-dispatch
  cancel-in-progress: false

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: بررسی امنیتی صف
        run: |
          if grep -rInE 'gh[pousr]_[A-Za-z0-9]{20,}|[0-9]{8,12}:[A-Za-z0-9_-]{30,}' tasks/queue/ 2>/dev/null; then
            echo "::error::تسک حاوی چیزی شبیه Secret است"; exit 1
          fi
          echo "صف تمیز است"

      - name: آیا به ffmpeg نیاز است
        id: need
        run: |
          if grep -rlE '"type"\s*:\s*"(ffmpeg|assemble)"' tasks/queue/ >/dev/null 2>&1; then
            echo "ffmpeg=yes" >> $GITHUB_OUTPUT
          else
            echo "ffmpeg=no" >> $GITHUB_OUTPUT
          fi

      - name: نصب ffmpeg در صورت نیاز
        if: steps.need.outputs.ffmpeg == 'yes'
        timeout-minutes: 6
        run: |
          if command -v ffmpeg >/dev/null; then
            echo "از قبل نصب است"; ffmpeg -version | head -1; exit 0
          fi
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: اجرای تسک‌ها
        timeout-minutes: 15
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python3 runner/runner.py

      - name: آپلود خروجی‌ها
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fox-output-${{ github.run_number }}
          path: out/
          if-no-files-found: ignore
          retention-days: 30

      - name: ثبت نتیجه‌ها در مخزن
        if: always()
        run: |
          git config user.name "fox-dispatch"
          git config user.email "dispatch@fox.local"
          rm -rf out
          git add -A tasks/ registry/
          if git diff --cached --quiet; then
            echo "تغییری نبود"
          else
            git commit -m "dispatch: نتیجه اجرای ${{ github.run_number }}"
            git pull --rebase --autostash || true
            git push
          fi
